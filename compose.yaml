name: ocr-service

services:
  ocr-service:
    image: ${CREW_IMAGE:?CREW_IMAGE is set by crew}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--port", "8100"]
    ports:
      - "127.0.0.1:18100:8100"
    env_file: ${CREW_SECRETS:?CREW_SECRETS is set by crew}/ocr-service.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/ocr/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
